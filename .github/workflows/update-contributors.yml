name: Update contributor statistics

on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update README statistics
        run: node scripts/update-contributors.mjs
      - name: Commit changes if needed
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update contributor statistics'
          git push origin HEAD:develop
