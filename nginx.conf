server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ซ่อน nginx version
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options      "nosniff"                                          always;
    add_header X-Frame-Options             "DENY"                                             always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"                  always;
    add_header Permissions-Policy          "geolocation=(), camera=(self), microphone=()"     always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload"     always;
    # Update this SHA-256 hash if the inline JSON-LD block in index.html changes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-DWSBmD4zyEddnle8/B/E0LFlKyy/eNTL4+ouxD2Lbzk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https://res.cloudinary.com blob:; connect-src 'self' https://api.flyupapi.dev wss://api.flyupapi.dev; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Always revalidate the SPA entry so it does not reference chunks from an old deployment.
    location = /index.html {
        expires -1;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
